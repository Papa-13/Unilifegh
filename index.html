<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YOLO · A Ghanaian life game</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<meta name="description" content="YOLO: live the life of a Ghanaian university student, from Level 100 to graduation, with real players.">
<meta name="theme-color" content="#0f0c0a">
</head>
<body>
<!-- launch animation: plain HTML + CSS so it shows while the game is still downloading; the game removes it when ready -->
<div id="splash" role="img" aria-label="YOLO, a Ghanaian life game">
  <div class="sp-sun"></div>
  <div class="sp-in"><div class="sp-logo"><div class="sp-band"></div><div class="yolo"><span>Y</span><span>O</span><span>L</span><span>O</span></div></div><div class="sp-tag">a ghanaian life game</div></div>
  <div class="sp-sub">Loading your campus…</div>
</div>
<div class="app">
  <header>
    <h1 class="logo">YO<span>LO</span></h1>
    <div class="top" id="top" hidden>
      <div class="chip"><small>Grade forecast</small><b id="hCwa">–</b></div>
      <div class="chip"><small>Friends</small><b id="hFr">0</b></div>
    </div>
  </header>
  <div class="crest" aria-hidden="true"></div>
  <section id="game" hidden>
    <div class="view">
      <canvas id="cv" aria-label="3D view of the campus"></canvas>
      <div class="vign" aria-hidden="true"></div>
      <div class="hud-tl">
        <button class="simcard glass" id="moodBtn" aria-label="Your Sim, mood and tasks"><span class="avatar" id="hAv"><i id="hAvI">A</i><em id="hMoodI">🙂</em></span><span class="sc-t"><b id="hName">You</b><small id="hMood">Fine</small></span></button>
        <div class="where glass" id="where">Campus</div>
      </div>
      <div class="hud-tr">
        <div class="clockp glass"><div class="hclock"><b id="hTime">07:00</b><small id="hDayL">Mon</small></div>
          <div class="speed" role="group" aria-label="Game speed"><button data-sp="0" aria-label="Pause">❚❚</button><button data-sp="1" aria-label="Normal speed">▶</button><button data-sp="2" aria-label="Fast">▶▶</button><button data-sp="3" aria-label="Fastest">▶▶▶</button></div></div>
        <div class="pills"><span class="pill money glass"><i>₵</i><b id="hMoney">0</b></span><button class="pill gem glass" id="gemBtn" aria-label="Gems"><b id="hGems">💎 0</b></button></div>
      </div>
      <div class="rail"><button class="glass" id="zin" aria-label="Zoom in">+</button><button class="glass" id="zout" aria-label="Zoom out">−</button><button class="glass" id="mapB" aria-label="Map">🗺</button><button class="glass" id="mpB" aria-label="Multiplayer: players online and chats">🌐<i></i></button><button class="glass" id="gfxB" style="font-size:10px;letter-spacing:.3px" aria-label="Graphics quality">HD</button></div>
      <canvas id="mini" width="300" height="210" aria-label="Campus map. Tap to walk there."></canvas>
      <div class="needs" id="needs" aria-label="Needs"></div>
      <div class="toast" id="toast" hidden></div>
      <div class="needcard" id="needCard" hidden></div>
      <div class="acts" id="acts"></div>
      <div class="dock">
        <div class="side"><button class="dbtn glass" id="dPhone" aria-label="Phone">📱<i class="dbadge" id="dUnread"></i><span>Phone</span></button><button class="dbtn glass" id="taskBtn" aria-label="Tasks">🎯<i class="dbadge" id="hTasks"></i><span>Tasks</span></button></div>
        <button class="interact" id="interact" aria-label="Actions">✦<i class="dbadge gold" id="intN"></i><span id="intL">Actions</span></button>
        <div class="side"><button class="dbtn glass" id="dEmote" aria-label="Emote">😀<span>Emote</span></button><button class="dbtn glass" id="dMood" aria-label="Moodlets">✨<span>Mood</span></button></div>
      </div>
      <div class="fade" id="fade"></div>
    </div>
  </section>
  <section id="panel" class="panel"></section>
  <p class="note">Prototype. Akwaaba University, its hostels, candidates and lecturers are fictional. Colleges, programmes, cut-offs and hostel prices are modelled on KNUST.</p>
</div>
<div id="sheet" hidden><div class="in" id="sheetIn"></div></div>
<div id="story" hidden><div class="in" id="storyIn"></div></div>
<!-- Online play: the game asks window.claude for 'room', 'db' and 'user'; on the website Firebase answers (src/online). -->
<script>window.__pairMail=true;window.__fbReady=new Promise(function(r){window.__fbResolve=r});window.claude={use:function(n){return window.__fbReady.then(function(a){return (a&&a[n])||null})}};</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
