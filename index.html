<style>
/* Layout: a "student ID card" shell — needs HUD on top, the 3D campus or your room in the middle, context actions under it, phone + sheets slide up. Hall-crest maroon & gold, Akwaaba green for good things. Single dark shell by choice. */
:root{
  --bg:#0f0d0c; --panel:#191614; --line:#2f2a26; --fg:#f6f0e8; --muted:#a99d92;
  --maroon:#8e2a3a; --gold:#e8b24a; --green:#4fb87a; --red:#e2564a; --blue:#5aa9e6;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.app{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.logo{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,36px);letter-spacing:-.8px;margin:0;line-height:1}
.logo span{color:var(--gold)}
.crest{height:6px;border-radius:2px;background:linear-gradient(90deg,var(--maroon) 0 70%,var(--gold) 70% 85%,var(--green) 85%)}
.top{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column}
.chip small{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chip b{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.chip.money b{color:var(--gold)}
.needs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:520px){.needs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.need{display:flex;flex-direction:column;gap:4px}
.need span{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--green);transition:width .3s}
.bar i.low{background:var(--red)} .bar i.mid{background:var(--gold)}
#game{display:flex;flex-direction:column;gap:10px}
.hudbar{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.hclock,.hchip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 10px;display:flex;flex-direction:column;justify-content:center;color:var(--fg);text-align:left;min-height:40px}
.hclock small,.hchip small{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hclock b,.hchip b{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hchip.money b{color:var(--gold)}.wkm{display:none}@media (max-width:700px){.wkm{display:inline}}
#gemBtn b{color:#7fd8ff}#gemBtn.pop{animation:pop .6s}@keyframes pop{30%{transform:scale(1.18);box-shadow:0 0 0 3px #7fd8ff55}}
.speed{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.speed button{background:none;color:var(--muted);font-size:11px;font-weight:800;padding:0 10px;min-width:38px;border-radius:0;letter-spacing:-1px}
.speed button[aria-pressed=true]{background:var(--gold);color:#1b1206}
.need span em{font-style:normal;margin-right:4px}.need span b{margin-left:auto}.need span .nl{font-style:normal}
.need.crit .bar{animation:crit 1s infinite}@keyframes crit{50%{box-shadow:0 0 0 2px var(--red)}}
.fade{position:absolute;inset:0;border-radius:12px;background:#0f0d0c;opacity:0;pointer-events:none;transition:opacity .35s ease}.fade.on{opacity:1;transition:none}
.needcard{position:absolute;left:50%;transform:translateX(-50%);top:52px;width:min(440px,calc(100% - 20px));z-index:3}
.nc{display:flex;gap:10px;align-items:flex-start;background:rgba(20,16,14,.94);border:1px solid var(--gold);border-radius:12px;padding:10px 12px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.nc.crit{border-color:var(--red);animation:crit 1.4s infinite}.nc .grow{flex:1;min-width:0}.nc b{display:block;font-size:14px}.nc small{display:block;color:var(--muted);font-size:12.5px;margin:2px 0 6px}
.nci{font-size:26px;line-height:1}.ncb{display:flex;flex-wrap:wrap;gap:6px}.ncx{background:none;color:var(--muted);font-size:16px;padding:2px 4px}
.busy{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:5px}.busyTop{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:600}.busyTop small{color:var(--muted);font-family:var(--mono);font-size:12px;white-space:nowrap}
.busy .bar{height:7px}.gemb{background:#7fd8ff;color:#06202e}.gemb.dim{opacity:.55}
.tasks{display:flex;flex-direction:column;gap:6px;margin:6px 0 8px}.task{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.task .grow{flex:1;min-width:0}.task b{font-size:14px}.task small{color:var(--muted);font-size:11.5px}.task .bar{height:5px;margin:4px 0 2px}.task.done{opacity:.55}.task.done b{text-decoration:line-through}.tic{font-size:20px}

.view{position:relative}
#cv{width:100%;max-width:100%;aspect-ratio:16/10;display:block;border-radius:12px;border:1px solid var(--line);background:#9fd3f0;touch-action:none;cursor:pointer}
@media (max-width:560px){#cv{aspect-ratio:4/5}}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:10px;background:rgba(15,13,12,.75);color:var(--fg);font-weight:800;font-size:18px;border:1px solid var(--line)}
.where{position:absolute;left:10px;top:10px;background:rgba(15,13,12,.75);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600}
#mini{position:absolute;left:10px;bottom:10px;width:150px;max-width:34%;aspect-ratio:4000/2800;border-radius:8px;border:1px solid var(--line);background:rgba(15,13,12,.8);cursor:crosshair}
.toast{position:absolute;left:50%;top:56px;transform:translateX(-50%);background:rgba(15,13,12,.9);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:14px;max-width:80%;text-align:center}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{background:var(--gold);color:#1b1206;font-weight:800;padding:11px 15px}
.btn:disabled{background:var(--line);color:var(--muted);cursor:default}
.btn.g{background:var(--green);color:#06210f}
.btn.m{background:var(--maroon);color:#fff}
.btn.b{background:var(--blue);color:#061a2b}
.ghost{background:transparent;border:1px solid var(--line);color:var(--fg);padding:11px 15px;font-weight:600}
.ghost:disabled{color:var(--muted);cursor:default}
.ghost.sm,.btn.sm{padding:8px 11px;font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--display);font-weight:800;font-size:clamp(24px,5vw,32px);line-height:1.05;margin:0;text-wrap:balance}
h2 em{font-style:normal;color:var(--gold)}
h3{font-family:var(--display);font-weight:700;font-size:19px;margin:0}
p{margin:0;line-height:1.55;color:var(--muted);max-width:65ch}
p strong{color:var(--fg)}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.feat div{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:5px}
.feat b{font-size:14px}.feat span{color:var(--muted);font-size:13px;line-height:1.45}
.maker{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:18px;align-items:start}
@media (max-width:640px){.maker{grid-template-columns:1fr}}
#pv{width:100%;max-width:100%;aspect-ratio:3/4;max-height:430px;display:block;border-radius:12px;background:#1d1917;border:1px solid var(--line)}
.opts{display:flex;flex-direction:column;gap:12px;min-width:0}
.opt{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pick{background:var(--bg);color:var(--fg);border:1.5px solid var(--line);padding:7px 11px;font-weight:600;font-size:14px}
.pick[aria-pressed="true"]{border-color:var(--gold);background:#2b2214}
.sw{width:32px;height:32px;padding:0;border-radius:50%;border:2px solid var(--line)}
.sw[aria-pressed="true"]{border-color:var(--gold)}
.pal{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 6px}
.pal i{width:20px;height:20px;border-radius:5px;flex:none}
input[type=text]{font:inherit;background:var(--bg);color:var(--fg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;max-width:260px}
/* accommodation */
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.room{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;color:var(--fg)}
.room:hover:not(:disabled){border-color:var(--gold)}
.room:disabled{opacity:.5;cursor:default}
.room .beds{display:flex;gap:4px}.room .beds i{width:18px;height:12px;border-radius:3px;background:var(--gold)}
.room .price{font-family:var(--mono);font-weight:700;font-size:18px;color:var(--gold)}
.room ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px;line-height:1.5}
.room .pros li::marker{color:var(--green)} .room .cons li::marker{color:var(--red)}
.sum{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted)} .sum b{color:var(--fg);font-family:var(--mono)}
/* sheet */
/* WhatsApp-style chats */
.chatl{display:flex;flex-direction:column}
.chatl button.chat{display:flex;gap:10px;align-items:center;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;width:100%}
.chatl .grow{min-width:0}
.chatl small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px}
.badge{background:#25a35a;color:#fff;border-radius:999px;font-size:12px;padding:1px 7px;font-weight:700}
.chatl time{font-size:11px;color:var(--muted);flex:none}
.thread{display:flex;flex-direction:column;gap:6px;height:44vh;min-height:220px;overflow-y:auto;padding:10px;background:#0b1410;border-radius:12px;border:1px solid var(--line)}
.bub{max-width:82%;padding:7px 10px;border-radius:12px;font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.bub.bin{align-self:flex-start;background:#1f2c34;border-top-left-radius:4px}
.bub.bout{align-self:flex-end;background:#035c4b;border-top-right-radius:4px}
.bub time{display:block;font-size:11px;color:rgba(255,255,255,.55);text-align:right;margin-top:2px}
.tick{color:rgba(255,255,255,.5)}.tick.seen{color:#53bdeb}
.vn{display:flex;align-items:center;gap:8px;min-width:190px}
.vn button{width:34px;height:34px;border-radius:50%;border:0;background:#25a35a;color:#fff;cursor:pointer;flex:none;font-size:14px}
.wave{display:flex;align-items:center;gap:2px;height:26px;flex:1}
.wave i{display:block;width:3px;border-radius:2px;background:rgba(255,255,255,.4)}
.wave i.on{background:#fff}
.vt{font-size:12px;color:rgba(255,255,255,.72);font-style:italic;margin-top:4px}
.sysm{align-self:center;font-size:12px;background:#1d2a30;color:#cfe3ea;padding:5px 10px;border-radius:8px;text-align:center;max-width:90%}
.typing{align-self:flex-start;font-size:13px;color:#8fd6a8;font-style:italic;padding:2px 8px}
.qr{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.qr button{white-space:nowrap;flex:none}
.composer{display:flex;gap:6px;align-items:center;margin-top:6px}
.composer input{flex:1;min-width:0;font:inherit;background:var(--bg);color:var(--fg);border:1.5px solid var(--line);border-radius:999px;padding:10px 14px}
.round{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;font-size:18px;flex:none;color:#fff;background:#25a35a}
.rec{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:999px;background:#2a1414;border:1px solid #6b2a2a;margin-top:6px}
.rec .dot{width:10px;height:10px;border-radius:50%;background:#ff3b3b;animation:blink 1s infinite;flex:none}
@keyframes blink{50%{opacity:.2}}
#sheet{position:fixed;inset:0;z-index:40;display:flex;justify-content:center;align-items:flex-end;background:rgba(0,0,0,.5)}
#sheet .in{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;width:100%;max-width:660px;max-height:84vh;overflow-y:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.who{display:flex;align-items:center;gap:10px}
.who .av{width:38px;height:38px;border-radius:50%;flex:none;border:3px solid #000}
.rel{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}
.rel .bar i{background:var(--blue)} .rel .bar i.rom{background:#e86fa0}
.say{background:var(--bg);border-radius:10px;padding:12px;line-height:1.5;border-left:3px solid var(--gold)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.grid2 button{text-align:left}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;border-radius:4px;padding:2px 7px;font-weight:600;background:var(--line);color:var(--muted)}
.tag.g{background:rgba(79,184,122,.2);color:#9be3b6}.tag.p{background:rgba(232,111,160,.2);color:#f5a6c6}.tag.y{background:rgba(232,178,74,.2);color:#f2cd85}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.msgs{display:flex;flex-direction:column;gap:8px}
.m{background:var(--bg);border-radius:10px;padding:10px 12px;line-height:1.45;font-size:14px}
.m b{display:block;font-size:12px;color:var(--gold)}
.m time{font-family:var(--mono);font-size:11px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.item .grow{flex:1;min-width:0}
.item small{display:block;color:var(--muted);font-size:12px}
.sw2{width:22px;height:22px;border-radius:5px;flex:none}
/* story */
#story{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;overflow-y:auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#story .in{max-width:560px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;margin:auto}
#story .scene{font-size:16px;line-height:1.6;color:#e8e0d6}
#mpB{position:relative}#mpB i{position:absolute;right:-3px;top:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#2f9e5a;color:#fff;font:800 10px/17px Figtree,system-ui;font-style:normal}#mpB i:empty{display:none}#mpB.hot i{background:#e5484d}#mpB.dim{opacity:.55}
.mptabs{display:flex;gap:6px;margin:8px 0;overflow-x:auto}.mptabs button{flex:none;border:1px solid var(--line,rgba(255,255,255,.15));background:transparent;color:inherit;border-radius:99px;padding:6px 11px;font:700 13px Figtree,system-ui;cursor:pointer}.mptabs button.on{background:#e8b24a;color:#1b1206;border-color:#e8b24a}
.mpth{max-height:min(42vh,340px);min-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:6px 2px;margin:6px 0}
.mpth .bub{max-width:82%;padding:7px 11px;border-radius:14px;font-size:14px;line-height:1.35;word-wrap:break-word}.mpth .bin{align-self:flex-start;background:rgba(255,255,255,.1)}.mpth .bout{align-self:flex-end;background:#2f6b3a;color:#fff}.mpth time{display:block;font-size:10px;opacity:.6;text-align:right}.mpth .sysm{align-self:center;font-size:12px;opacity:.85;text-align:center}
.mpin{display:flex;gap:8px;margin:8px 0}.mpin input{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:inherit;font:600 15px Figtree,system-ui}
.mpacts{display:flex;gap:6px;flex-wrap:wrap}.mpacts .ghost{padding:6px 10px}

#cmap{position:fixed;inset:0;z-index:46;display:flex;flex-direction:column;background:rgba(14,11,9,.94);backdrop-filter:blur(6px);color:#f6efe6;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px calc(env(safe-area-inset-bottom,0px) + 10px)}
#cmap[hidden]{display:none}
#cmap .cm-top{display:flex;gap:8px;align-items:center}#cmap .cm-top b{font-size:17px;white-space:nowrap}
#cmq{flex:1;min-width:0;padding:9px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font:600 14px Figtree,system-ui}
#cmx{width:38px;height:38px;border-radius:12px;flex:none}
#cmchips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}#cmchips::-webkit-scrollbar{display:none}
.cmchip{flex:none;border:1px solid var(--cc);background:transparent;color:#f6efe6;border-radius:99px;padding:6px 11px;font:700 13px Figtree,system-ui;cursor:pointer}.cmchip.on{background:var(--cc);color:#1b1206}
#cmap .cm-wrap{position:relative;flex:1;min-height:0;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.12);touch-action:none}
#cmc{display:block;touch-action:none;cursor:grab}
#cmap .cm-zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}#cmap .cm-zoom button{width:38px;height:38px;border-radius:12px;font-size:18px}
#cmap .cm-legend{position:absolute;left:8px;bottom:8px;font:600 11px Figtree,system-ui;background:rgba(0,0,0,.55);padding:5px 9px;border-radius:9px;color:#e8e0d6}
#cmlist{position:absolute;left:8px;top:8px;max-width:min(300px,70%);max-height:70%;overflow:auto;background:rgba(20,16,13,.95);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:4px;display:flex;flex-direction:column}
#cmlist[hidden]{display:none}#cmlist button{text-align:left;background:none;border:0;color:#fff;padding:8px 10px;border-radius:8px;font:600 14px Figtree,system-ui;display:flex;justify-content:space-between;gap:8px;cursor:pointer}#cmlist button:hover{background:rgba(255,255,255,.08)}#cmlist small{opacity:.6}

function nextLecture(){for(let k=0;k<7*48;k++){const m=S.min+k*30,d=Math.floor(m/1440)%7,h=(m%1440)/60,L=TT[d]&&TT[d].find(([c,st])=>Math.abs(h-st)<.01);if(L)return `Next: ${courseName(L[0])}, ${DAYS[d]} ${String(L[1]).padStart(2,'0')}:00`}return ''}
function spend(n){if(P().money<n){toast(`Not enough on MoMo (${cedi(P().money)}).`);return false}P().money-=n;return true}
function eat(cost,food,name,fun=4){if(!spend(cost))return;doAct(`Eating ${name}`,25,{hunger:food,fun})}
function buffFromAct(l,fx){if(/shower|bath/i.test(l))addBuff('fresh');if(/^eating|cooking/i.test(l)&&(fx.hunger||0)>=30)addBuff('fed');if(/concert|watch .*(show|perform)/i.test(l))addBuff('inspired');if(/tidying/i.test(l))addBuff('tidy');if(fx&&fx.study>=8)addBuff('studied');if(/vibing|music|club|dancing/i.test(l))addBuff('music')}
function applyAct(label,mins,fx){const p=P();const timed=S.timedDone;try{buffFromAct(label,fx||{})}catch(e){}S.timedDone=false;if(!timed)advance(mins);try{ev('act',{l:label,mins,fx})}catch(e){}
  if(timed){if(IS&&IS.mine&&/eating|cooking|fifa|cold drink/i.test(label))p.mess=clamp((p.mess||0)+4);toast(`✓ ${label}`+(fx.study?` · Study +${Math.round(fx.study*moodInfo().study)}`:''));hud();acts(true);return}
  if(IS&&IS.mine&&/eating|cooking|fifa|cold drink/i.test(label))p.mess=clamp((p.mess||0)+4);Object.entries(fx).forEach(([k,v])=>{if(k==='study')p.study+=v;else p.needs[k]=clamp(p.needs[k]+v)});
  toast(`${label} · ${mins>=60?(mins/60)+'h':mins+'m'}`+(fx.study?` · Study +${fx.study}`:''));hud();acts(true)}
function work(mins,pay,label,fx={}){P().money+=pay;doAct(label,mins,Object.assign({energy:-18,fun:-6},fx));toast(`${label} · earned ${cedi(pay)} 💸`)}
function sleep(){const h=hour();if(!(h>=20||h<5))return toast('It\'s too early to sleep. Take a nap instead.');
  startBusy('Sleeping',{pose:'lie',spot:IS&&IS.spots.bed},3200,sleepNow)}
function sleepNow(){const p=P(),h=hour();
  if(h>=20||h<5){const target=(h>=20?(day()+1)*1440:day()*1440)+6*60;const mins=target-S.min;S.min=target;const n=p.needs;
    S.lastSleep={day:day(),h:mins/60};try{ev('sleep',mins/60);addBuff(mins/60>=7?'rested':mins/60<5?'groggy':'')}catch(e){}const q=roomMult()*(p.items.includes('fan')&&!roomOf().ac?1.12:1);n.energy=clamp(55+45*q);n.hunger=clamp(n.hunger-mins*.03);n.social=clamp(n.social-(S.mates.length?2:10));n.fun=clamp(n.fun-5);n.hygiene=clamp(n.hygiene-8);hourly();
    toast(q<.8?`You slept, but ${S.mates[0]?S.mates[0].name+' was on the phone till 2am':'it was noisy'}. Energy ${Math.round(n.energy)} 😴`:`You slept well. Good morning! ☀️ Energy ${Math.round(n.energy)}`);refreshRoom()}
  else toast('It\'s too early to sleep. Take a nap instead.')}
function nap(){doAct('Taking a nap',120,{energy:Math.round(30*roomMult())})}
function meetRandom(where){const n=pick(S.npcs.filter(n=>n.plan&&n.plan.b===where))||pick(S.npcs);n.met=true;n.friend=clamp(n.friend+5);toast(`You got talking with ${n.name}. Friendship +5`)}
function freshersNight(){if(S.fnDone)return toast('You already partied tonight. Your legs need rest. 😅');S.fnDone=true;advance(180);const p=P();p.needs.fun=100;p.needs.social=clamp(p.needs.social+40);p.needs.energy=clamp(p.needs.energy-25);

  story(`<div class="eyebrow">Freshers' Night · Akwaaba Square</div><h3>The whole campus is outside. 🔥</h3><p class="scene">The DJ plays back-to-back Afrobeats and amapiano. Every hostel chants its name when the bass drops. You dance with ${met.slice(0,3).map(n=>n.name).join(', ')} and ${met[3].name} until the SRC president begs everyone to go home.</p><p>Fun maxed · 4 new friendships</p>`,[['What a night','g',()=>{}]])}
function goHome(){const p=P();const t=(day()+1)*1440+18*60;S.min=t;S.lastHour=-1;
  const gift={rich:600,avg:150,poor:40}[p.bg];p.needs.energy=100;p.needs.hunger=95;p.needs.fun=clamp(p.needs.fun+25);p.needs.social=clamp(p.needs.social-10);p.money+=gift;p.prov+=6;hourly();
  const b=homeB();p.x=b.door[0];p.y=b.door[1]+22*outDir(b);
  const scene={rich:'The driver picks you up at the trotro station. At home there is jollof, chicken and a long lecture from Dad about your grades.',avg:'You sleep in your own bed, eat fufu and light soup, and listen to Mum warn you about "these university boys and girls".',poor:'You help Mum at the market on Saturday. On Sunday she cooks palm nut soup and packs your chop box with gari and shito.'}[p.bg];
  story(`<div class="eyebrow">Weekend at home</div><h3>Home is home.</h3><p class="scene">${scene} Before you leave, ${p.bg==='rich'?'Dad':'Mum'} slips you ${cedi(gift)}.</p><p>Energy full · +6 provisions · +${cedi(gift)}</p>`,[['Back to campus','g',()=>{}]])}

function atm(){const p=P();if(!p.acct)return toast(`ATM: MoMo balance ${cedi(p.money)}. Open a bank account to save money 🏦`);bankSheet('wd',true)}
function bankSheet(kind,atmMode){S.paused=true;openSheet();const p=P();
  const draw=(note='')=>{$('sheetIn').innerHTML=`<div class="eyebrow">${atmMode?'🏧 ATM':BID[p.acct].name}</div><h3>${kind==='dep'?'💰 Deposit to savings':'💵 Withdraw from savings'}</h3><p style="font-size:14px">MoMo ${cedi(p.money)} · Savings ${cedi(p.savings)} · 1.5% interest every Monday</p>${note?`<div class="say">${note}</div>`:''}
    <div class="row" style="flex-wrap:wrap">${[50,100,200,500].map(v=>`<button class="btn sm" data-v="${v}">${cedi(v)}</button>`).join('')}<button class="ghost sm" data-v="all">All</button></div>${!atmMode?`<button class="ghost sm" id="sw2">${kind==='dep'?'Withdraw instead':'Deposit instead'}</button>`:''}<button class="ghost sm" id="bye">Done</button>`;
    $('sheetIn').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const v=b.dataset.v,amt=Math.floor(v==='all'?(kind==='dep'?p.money:p.savings):+v);if(amt<=0)return draw('Nothing to move.');

function npcReply(n,intent,vn){const p=P();let lines=RB[intent]||RB.def;

function sendChat(chat,text,vn){try{ev('chat',{vn:!!vn,fam:/mum|dad|auntie|uncle|sis|bro/i.test(chat)})}catch(e){}const p=P(),n=S.npcs.find(x=>x.name===chat),m={from:'You',chat,text,at:S.min,mine:true,read:true,vn};S.msgs.unshift(m);

    p.needs.social=clamp(p.needs.social+gainSoc);m.seen=true;S.typing=null;msg(chat,t,(vn?Math.random()<.55:Math.random()<.15)?{secs:RI(4,18)}:null);if(CHAT===chat&&!$('sheet').hidden)drawChat();hud()};

  if(asleep){(S.pending=S.pending||[]).push({due:(hour()>=23.5?day()+1:day())*1440+6*60+RI(10,90),fn:reply});drawChat();return}

let ACX=null;function babble(dur,g,sing){try{ACX=ACX||new (window.AudioContext||window.webkitAudioContext)();const now=ACX.currentTime,base=g==='f'?230:130,notes=[0,2,4,7,9,12];

/* ================= character maker ================= */
let pvOn=false,pvR=null,pvScene,pvCam,pvModel=null,pvAngle=.5,faceZoom=false;
function setupPreview(c){
  if(pvR){pvR.dispose();pvR.forceContextLoss()}
  pvR=new THREE.WebGLRenderer({canvas:c,antialias:true});pvR.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
  pvScene=new THREE.Scene();{const c=document.createElement('canvas');c.width=4;c.height=256;const g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#4a2128');gr.addColorStop(.55,'#2a1a18');gr.addColorStop(1,'#120d0b');g.fillStyle=gr;g.fillRect(0,0,4,256);pvScene.background=new THREE.CanvasTexture(c)}
  pvCam=new THREE.PerspectiveCamera(28,3/4,.1,50);pvCam.position.set(0,1.3,4.6);pvCam.lookAt(0,1.15,0);
  pvScene.add(new THREE.HemisphereLight(0xeef2ff,0x3a2a18,.85));
  const key=new THREE.DirectionalLight(0xffe6c0,.8);key.position.set(2,3,3);pvScene.add(key);
  const rim=new THREE.DirectionalLight(0xe8b24a,.45);rim.position.set(-3,2,-2);pvScene.add(rim);
  const floor=mesh(new THREE.CylinderGeometry(.85,.9,.08,48),new THREE.MeshStandardMaterial({color:0x3a2c22,roughness:.4,metalness:.2}),0,-.04,0,pvScene);const ring=mesh(new THREE.TorusGeometry(.86,.012,8,64),new THREE.MeshBasicMaterial({color:0xe8b24a}),0,0,0,pvScene);ring.rotation.x=Math.PI/2;
  pvModel=null;rebuildPreview();pvOn=true}
function rebuildPreview(){if(!pvScene)return;if(pvModel){pvScene.remove(pvModel);disposeTree(pvModel)}pvModel=makeHuman(myLook).g;pvModel.rotation.y=pvAngle;pvScene.add(pvModel)}
function renderPreview(dt){const c=$('pv');if(!c||!pvR)return;fitR(pvR,pvCam,c);pvAngle+=dt*.5;if(pvModel)pvModel.rotation.y=faceZoom?Math.sin(performance.now()/1200)*.6:pvAngle;
  const wide=pvCam.aspect>1.1;pvCam.position.y+=((faceZoom?1.56:1.3)-pvCam.position.y)*.1;pvCam.position.z+=((faceZoom?1.15:wide?3.9:4.6)-pvCam.position.z)*.1;pvCam.position.x+=((wide&&!faceZoom?.35:0)-pvCam.position.x)*.1;pvCam.lookAt(0,faceZoom?1.52:1.1,0);pvR.render(pvScene,pvCam)}
let CASTAB='gender';
function maker(){
  if(IS)leaveRoom(true);
  document.body.classList.remove('playing');document.body.classList.add('setup');$('panel').classList.remove('bleed');$('game').hidden=true;$('top').hidden=true;$('panel').hidden=false;$('story').hidden=true;$('sheet').hidden=true;
  const g=myLook.gender;if(!HAIR[g][myLook.hair])myLook.hair=Object.keys(HAIR[g])[0];if(!OUTFIT[g][myLook.outfit])myLook.outfit=Object.keys(OUTFIT[g])[0];
  if(g==='m'&&myLook.extra==='earrings')myLook.extra='none';
  const chips=(key,obj)=>Object.entries(obj).map(([k,v])=>`<button class="pick" data-k="${key}" data-v="${k}" aria-pressed="${myLook[key]===k}">${v}</button>`).join('');
  const ex=Object.fromEntries(Object.entries(EXTRA).filter(([k])=>g==='f'||k!=='earrings'));
  const TABS=[['gender','🧍','Body'],['skin','🎨','Skin'],['hair','💇','Hair'],['outfit','👕','Outfit'],['pal','🌈','Colour'],['shoes','👟','Shoes'],['extra','✨','Extras'],['bag','🎒','Bag'],['int','❤️','Likes']];
  const tabBody=t=>t==='gender'?`<div class="chips big">${chips('gender',{f:'👩🏾 Female',m:'👨🏾 Male'})}</div>`:t==='skin'?`<div class="chips">${SKINS.map(x=>`<button class="sw" data-k="skin" data-v="${x}" aria-label="Skin tone" aria-pressed="${myLook.skin===x}" style="background:${x}"></button>`).join('')}</div>`:
    t==='hair'?`<div class="chips">${chips('hair',HAIR[g])}</div>`:t==='outfit'?`<div class="chips">${chips('outfit',OUTFIT[g])}</div>`:t==='pal'?`<div class="chips">${Object.entries(PAL).map(([k,pp])=>`<button class="pick pal" data-k="pal" data-v="${k}" aria-pressed="${myLook.pal===k}"><i style="background:linear-gradient(135deg,${pp.a} 50%,${pp.b} 50%)"></i>${pp.name}</button>`).join('')}</div>`:
    t==='shoes'?`<div class="chips">${chips('shoes',SHOES)}</div>`:t==='extra'?`<div class="chips">${chips('extra',ex)}</div>`:t==='bag'?`<div class="chips">${chips('bag',BAGS)}</div>`:
    `<div class="eyebrow" style="margin-bottom:6px">Pick 2 · they shape who you click with</div><div class="chips">${INTERESTS.map(x=>`<button class="pick" data-int="${x}" aria-pressed="${myLook.interests.includes(x)}">${x}</button>`).join('')}</div>`;
  $('panel').classList.add('bleed');
  $('panel').innerHTML=`<div class="cas">
   <div class="cas-stage"><canvas id="pv" aria-label="Preview of your character"></canvas>
     <div class="cas-top"><div><div class="eyebrow">Akwaaba University · Level 100</div><h2>Create your <em>student</em></h2><p class="cas-sub">Then the system picks your family background, you apply for programmes, get admitted and move into a hostel.</p></div></div>
     <div class="cas-tools"><button class="glass" id="face">👁 Face</button><button class="glass" id="rnd">🎲 Surprise</button></div></div>
   <div class="cas-panel">
     <div class="cas-tabs" role="tablist">${TABS.map(([k,ic,l])=>`<button class="cas-tab" role="tab" data-tab="${k}" aria-pressed="${CASTAB===k}">${ic}<span>${l}</span></button>`).join('')}</div>
     <div class="cas-opts" id="casOpts">${tabBody(CASTAB)}</div>
     <div class="cas-foot"><input type="text" id="nm" maxlength="14" placeholder="Your name, e.g. Ama" aria-label="Name" value="${esc(myLook.name||'')}"><button class="btn m" id="go">Continue ➜</button></div>
   </div></div>`;
  $('panel').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{CASTAB=b.dataset.tab;myLook.name=$('nm').value;maker()});
  $('panel').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;myLook[k]=b.dataset.v;
    if(k==='gender'){myLook.name=$('nm').value;return maker()}
    $('panel').querySelectorAll(`[data-k="${k}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b));rebuildPreview()});
  $('panel').querySelectorAll('[data-int]').forEach(b=>b.onclick=()=>{const i=b.dataset.int;let a=myLook.interests.filter(x=>x!==i);if(a.length===myLook.interests.length)a=[...a,i].slice(-2);myLook.interests=a;
    $('panel').querySelectorAll('[data-int]').forEach(x=>x.setAttribute('aria-pressed',myLook.interests.includes(x.dataset.int)))});
  $('nm').oninput=e=>myLook.name=e.target.value;
  $('face').onclick=e=>{faceZoom=!faceZoom;e.target.textContent=faceZoom?'🧍 Body':'👁 Face'};
  $('rnd').onclick=()=>{const keep={name:myLook.name,interests:myLook.interests};myLook=Object.assign(randomLook(pick(['m','f'])),keep);maker()};
  $('go').onclick=()=>{if(myLook.interests.length<1)myLook.interests=['Afrobeats'];try{localStorage.setItem('freshers-look',JSON.stringify(myLook))}catch(e){}
    pvOn=false;faceZoom=false;rollBackground()};
  setupPreview($('pv'));
}
